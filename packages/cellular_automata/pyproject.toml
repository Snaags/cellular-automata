[project]
name = "cellular-automata"
version = "0.1.0"
description = "Cellular automata combat simulation with TUI viewer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "blessed",
    "gridcore",
]

[project.scripts]
cellular-automata-tui = "cellular_automata.tui_viewer:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
pygame = ["pygame"]
textual = ["textual"]

[tool.uv]
package = true
